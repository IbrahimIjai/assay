<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Assay Protocol project cover</title>
  <desc id="desc">Verified reserves and private credit for tokenized real-world assets, powered by AI agents, zero-knowledge proofs, and HashKey Chain.</desc>
  <defs>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#ffffff" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <linearGradient id="orangeGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="cardFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".045"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity=".32"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="36" fill="#0f1115"/>
  <rect width="1600" height="900" rx="36" fill="url(#grid)"/>
  <circle cx="1350" cy="160" r="230" fill="#f97316" opacity=".09" filter="url(#softGlow)"/>
  <circle cx="1120" cy="750" r="240" fill="#1f9d5b" opacity=".07" filter="url(#softGlow)"/>

  <!-- Brand -->
  <g transform="translate(92 76)">
    <rect x="1" y="1" width="54" height="54" rx="15" fill="none" stroke="#ffffff" stroke-width="4"/>
    <path d="M28 14 42 28 28 42 14 28Z" fill="#ffffff"/>
    <text x="76" y="40" fill="#ffffff" font-family="Manrope, Inter, Arial, sans-serif" font-size="38" font-weight="650" letter-spacing="-1.4">Assay</text>
  </g>
  <g transform="translate(1242 84)">
    <circle cx="8" cy="12" r="6" fill="#43bf83"/>
    <text x="28" y="19" fill="#c6c9d2" font-family="JetBrains Mono, monospace" font-size="20" letter-spacing="1.2">HASHKEY CHAIN</text>
  </g>

  <!-- Main copy -->
  <g transform="translate(92 240)">
    <rect width="316" height="46" rx="23" fill="#f97316"/>
    <text x="24" y="30" fill="#ffffff" font-family="Manrope, Inter, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">VERIFIABLE RWA INFRASTRUCTURE</text>

    <text y="142" fill="#ffffff" font-family="Manrope, Inter, Arial, sans-serif" font-size="88" font-weight="560" letter-spacing="-4.5">
      <tspan x="0" dy="0">Verified reserves.</tspan>
      <tspan x="0" dy="94">Private credit.</tspan>
      <tspan x="0" dy="94">One registry.</tspan>
    </text>

    <text x="2" y="472" fill="#9da2af" font-family="Manrope, Inter, Arial, sans-serif" font-size="27" font-weight="430">
      <tspan x="2">AI agents turn private custodian evidence into</tspan>
      <tspan x="2" dy="40">on-chain proof—without exposing the reserve book.</tspan>
    </text>
  </g>

  <!-- Proof system visual -->
  <g transform="translate(1000 224)" filter="url(#shadow)">
    <rect x="92" y="0" width="410" height="500" rx="32" fill="url(#cardFill)" stroke="#ffffff" stroke-opacity=".13"/>

    <g transform="translate(132 42)">
      <text fill="#707684" font-family="JetBrains Mono, monospace" font-size="15" letter-spacing="1.8">RESERVE PROOF / 0x7D4A…7C93</text>
      <line x1="0" y1="37" x2="330" y2="37" stroke="#ffffff" stroke-opacity=".1"/>
    </g>

    <g transform="translate(214 104)">
      <circle cx="82" cy="82" r="80" fill="#062517" stroke="#43bf83" stroke-opacity=".42" stroke-width="2"/>
      <circle cx="82" cy="82" r="59" fill="#1f9d5b" fill-opacity=".16"/>
      <rect x="50" y="50" width="64" height="64" rx="18" fill="none" stroke="#74d6a5" stroke-width="4"/>
      <path d="M82 61 103 82 82 103 61 82Z" fill="#74d6a5"/>
      <path d="m127 31 13 13 25-29" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="297" y="316" text-anchor="middle" fill="#ffffff" font-family="Manrope, Inter, Arial, sans-serif" font-size="33" font-weight="650">Coverage verified</text>
    <text x="297" y="350" text-anchor="middle" fill="#74d6a5" font-family="JetBrains Mono, monospace" font-size="17" letter-spacing="1.5">RESERVES ≥ SUPPLY</text>

    <g transform="translate(132 390)">
      <rect width="96" height="36" rx="18" fill="#ffffff" fill-opacity=".075"/>
      <text x="48" y="24" text-anchor="middle" fill="#dfe1e7" font-family="JetBrains Mono, monospace" font-size="13">AI AGENTS</text>
      <rect x="108" width="105" height="36" rx="18" fill="#ffffff" fill-opacity=".075"/>
      <text x="160" y="24" text-anchor="middle" fill="#dfe1e7" font-family="JetBrains Mono, monospace" font-size="13">GROTH16 ZK</text>
      <rect x="225" width="105" height="36" rx="18" fill="#ffffff" fill-opacity=".075"/>
      <text x="277" y="24" text-anchor="middle" fill="#dfe1e7" font-family="JetBrains Mono, monospace" font-size="13">ON-CHAIN</text>
    </g>
  </g>

  <!-- Layered evidence cards -->
  <g transform="translate(934 660) rotate(-5)">
    <rect width="258" height="116" rx="20" fill="#ffffff" stroke="#dfe1e7"/>
    <rect x="22" y="22" width="52" height="52" rx="14" fill="#fff6ec"/>
    <path d="M39 37h18v22H39zm4-7h10v7H43z" fill="#f97316"/>
    <text x="92" y="48" fill="#22262e" font-family="Manrope, Inter, Arial, sans-serif" font-size="19" font-weight="700">Private evidence</text>
    <text x="92" y="76" fill="#707684" font-family="JetBrains Mono, monospace" font-size="13">CUSTODIAN PDF</text>
  </g>
  <g transform="translate(1262 670) rotate(5)">
    <rect width="244" height="112" rx="20" fill="#ecfaf2" stroke="#74d6a5" stroke-opacity=".55"/>
    <circle cx="54" cy="55" r="27" fill="#1f9d5b"/>
    <path d="m42 55 8 8 17-19" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="94" y="49" fill="#135131" font-family="Manrope, Inter, Arial, sans-serif" font-size="18" font-weight="750">Fresh &amp; covered</text>
    <text x="94" y="76" fill="#17804a" font-family="JetBrains Mono, monospace" font-size="13">PUBLIC CLAIM</text>
  </g>

  <!-- Footer -->
  <g transform="translate(92 823)">
    <line x1="0" y1="-27" x2="1416" y2="-27" stroke="#ffffff" stroke-opacity=".11"/>
    <text fill="#707684" font-family="JetBrains Mono, monospace" font-size="16" letter-spacing="1.2">PRIVATE INPUTS</text>
    <circle cx="174" cy="-5" r="3" fill="#4e5461"/>
    <text x="190" fill="#707684" font-family="JetBrains Mono, monospace" font-size="16" letter-spacing="1.2">PUBLIC PROOFS</text>
    <circle cx="354" cy="-5" r="3" fill="#4e5461"/>
    <text x="370" fill="#707684" font-family="JetBrains Mono, monospace" font-size="16" letter-spacing="1.2">ENFORCED ON-CHAIN</text>
    <text x="1416" text-anchor="end" fill="#ffffff" font-family="Manrope, Inter, Arial, sans-serif" font-size="18" font-weight="650">assay protocol</text>
  </g>
</svg>
