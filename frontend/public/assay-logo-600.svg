<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">Assay Protocol logo</title>
  <desc id="desc">The Assay hallmark: a rounded square containing a struck diamond.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".04" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="46%" r="58%">
      <stop offset="0" stop-color="#f97316" stop-opacity=".18"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="diamond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity=".34"/>
    </filter>
  </defs>

  <rect width="600" height="600" rx="108" fill="#0f1115"/>
  <rect width="600" height="600" rx="108" fill="url(#grid)"/>
  <circle cx="300" cy="280" r="250" fill="url(#glow)"/>

  <g filter="url(#shadow)">
    <rect x="132" y="132" width="336" height="336" rx="98" fill="#16181d" stroke="#ffffff" stroke-width="20"/>
    <path d="M300 198 402 300 300 402 198 300Z" fill="url(#diamond)"/>
  </g>
</svg>
